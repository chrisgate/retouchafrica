services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      UPLOADS_DIR: /app/public/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
    volumes:
      - uploads_data:/app/public/uploads

volumes:
  uploads_data:

# Postgres runs as a separate Coolify resource, not as a service here.
# Set DATABASE_URL to that resource's connection string (its internal
# hostname, from the Coolify service page, works since both resources
# share Coolify's Docker network).
#
# First deploy only: seed placeholder content and the single admin user with
#   docker compose exec app npx prisma db seed
# Do NOT run this automatically on every container start — the seed script
# upserts the placeholder workshop's copy/dates, which would clobber real
# edits made later through /admin.
