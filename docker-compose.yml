services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://retouch:${POSTGRES_PASSWORD}@db:5432/retouchafrica
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      UPLOADS_DIR: /app/public/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_EMAIL_TO: ${NOTIFY_EMAIL_TO:-}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: retouchafrica
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retouch -d retouchafrica"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads_data:

# First deploy only: seed placeholder content and the single admin user with
#   docker compose exec app npx prisma db seed
# Do NOT run this automatically on every container start — the seed script
# upserts the placeholder workshop's copy/dates, which would clobber real
# edits made later through /admin.
